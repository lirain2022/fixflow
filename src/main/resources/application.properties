spring.application.name=fixflow
spring.profiles.default=complete
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.address=${SERVER_ADDRESS:127.0.0.1}
fixflow.jwt-secret=${FIXFLOW_JWT_SECRET:}
fixflow.upload-dir=${FIXFLOW_UPLOAD_DIR:./data/uploads}
fixflow.redis-enabled=${FIXFLOW_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
